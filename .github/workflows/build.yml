name: Build Cricket Championship 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Check Project Files
        shell: bash
        run: |
          set -e

          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn
          test -f scripts/main.gd

          grep -F 'run/main_scene="res://scenes/Main.tscn"' project.godot

          echo "All required project files are present."

      - name: Import Godot Project
        shell: bash
        run: |
          set -e
          godot --headless --editor --path . --quit

      - name: Install Godot Android Export Templates
        shell: bash
        run: |
          set -e

          GODOT_VERSION="4.3.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"

          mkdir -p "$TEMPLATE_DIR"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o /tmp/godot_templates.tpz

          mkdir -p /tmp/godot_templates
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates

          TEMPLATE_SOURCE="$(find /tmp/godot_templates -type d -name templates -print -quit)"

          if [ -z "$TEMPLATE_SOURCE" ]; then
            echo "ERROR: Godot export templates folder was not found."
            find /tmp/godot_templates -maxdepth 3 -type f
            exit 1
          fi

          cp -r "$TEMPLATE_SOURCE"/. "$TEMPLATE_DIR"/

          echo "$GODOT_VERSION" > "$TEMPLATE_DIR/version.txt"

          echo "Installed export templates:"
          ls -la "$TEMPLATE_DIR"

      - name: Verify Android Export Preset
        shell: bash
        run: |
          set -e

          grep -F 'name="Android"' export_presets.cfg
          grep -F 'platform="Android"' export_presets.cfg
          grep -F 'package/unique_name="com.cricketchampionship.game"' export_presets.cfg

          echo "Android export preset verified."

      - name: Export Android APK
        shell: bash
        run: |
          set -e

          godot --headless \
            --path . \
            --export-debug "Android" \
            CricketChampionship3D.apk

          test -s CricketChampionship3D.apk

          echo "APK exported successfully."
          ls -lh CricketChampionship3D.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Championship-3D-APK
          path: CricketChampionship3D.apk
          if-no-files-found: error
          retention-days: 14
