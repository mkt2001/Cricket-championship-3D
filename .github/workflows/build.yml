name: Cricket Championship 3D - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Check project files
        run: |
          test -f project.godot
          test -f scenes/Main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg

      - name: Check Android export preset
        run: |
          grep -F 'name="Android"' export_presets.cfg
          grep -F 'platform="Android"' export_presets.cfg

      - name: Import Godot project
        run: |
          godot --headless --editor --path . --quit

      - name: Install Godot Android Export Templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          find /tmp/godot-templates -type f
          TEMPLATE_DIR="$(find /tmp/godot-templates -type d -name 'templates' | head -n 1)"
          test -n "$TEMPLATE_DIR"
          cp "$TEMPLATE_DIR"/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Export Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          godot --headless \
            --path . \
            --export-debug "Android" \
            CricketChampionship3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Championship-3D-APK
          path: CricketChampionship3D.apk
          if-no-files-found: error
