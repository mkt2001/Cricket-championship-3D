name: Build Cricket Championship 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313'
          accept-android-sdk-licenses: true

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Diagnose Project Files
        shell: bash
        run: |
          set -eu

          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Scene files:"
          find scenes -maxdepth 2 -type f -print || true

          echo ""
          echo "Script files:"
          find scripts -maxdepth 2 -type f -print || true

          echo ""
          echo "Checking required files..."

          for file in \
            project.godot \
            export_presets.cfg \
            scenes/Main3D.tscn \
            scripts/game_3d.gd
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done

          echo ""
          echo "Main scene setting:"
          grep -n 'run/main_scene' project.godot || true

          echo ""
          echo "Android preset:"
          grep -nE 'name="Android"|platform="Android"' export_presets.cfg || true

      - name: Install Godot Android Export Templates
        shell: bash
        run: |
          set -eu

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$TEMPLATE_DIR"
          mkdir -p /tmp/godot_templates

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o /tmp/godot_templates.tpz

          unzip -q /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          TEMPLATE_SOURCE="$(find /tmp/godot_templates -type d -name templates -print -quit)"

          if [ -z "$TEMPLATE_SOURCE" ]; then
            echo "ERROR: Godot export templates not found."
            exit 1
          fi

          cp -r "$TEMPLATE_SOURCE"/. "$TEMPLATE_DIR"/
          echo "4.3.stable" > "$TEMPLATE_DIR/version.txt"

          ls -la "$TEMPLATE_DIR"

      - name: Create Android Debug Keystore
        shell: bash
        run: |
          set -eu

          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storetype PKCS12

          test -s "$GITHUB_WORKSPACE/debug.keystore"

      - name: Configure Godot Android Settings
        shell: bash
        run: |
          set -eu

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          test -x "$JAVA_HOME/bin/java"
          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

      - name: Import and Validate Godot Project
        shell: bash
        run: |
          set -uo pipefail

          godot --headless \
            --editor \
            --path . \
            --quit 2>&1 | tee import.log

          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "ERROR: Godot import failed."
            exit "$status"
          fi

          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' import.log; then
            echo "ERROR: A script failed to load."
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail

          godot --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            CricketChampionship3D.apk 2>&1 | tee export.log

          test -s CricketChampionship3D.apk

          echo "APK exported successfully."
          ls -lh CricketChampionship3D.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Championship-3D-APK
          path: CricketChampionship3D.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Android-Build-Logs
          path: |
            import.log
            export.log
          if-no-files-found: ignore
          retention-days: 7
