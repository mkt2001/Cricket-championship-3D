name: Build Cricket Championship 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313'
          accept-android-sdk-licenses: true

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Check Project Files
        shell: bash
        run: |
          set -e
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn
          test -f scripts/main.gd
          grep -F 'run/main_scene="res://scenes/Main.tscn"' project.godot
          echo "Project files verified."

      - name: Install Godot Android Export Templates
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o /tmp/godot_templates.tpz

          mkdir -p /tmp/godot_templates
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates

          TEMPLATE_SOURCE="$(find /tmp/godot_templates -type d -name templates -print -quit)"

          if [ -z "$TEMPLATE_SOURCE" ]; then
            echo "ERROR: Godot export templates not found."
            find /tmp/godot_templates -maxdepth 3 -type f
            exit 1
          fi

          cp -r "$TEMPLATE_SOURCE"/. "$TEMPLATE_DIR"/
          echo "4.3.stable" > "$TEMPLATE_DIR/version.txt"

          echo "Export templates installed."

      - name: Configure Godot Android Settings
        shell: bash
        run: |
          set -e

          GODOT_CONFIG="$HOME/.config/godot"
          mkdir -p "$GODOT_CONFIG"

          SETTINGS_FILE="$GODOT_CONFIG/editor_settings-4.tres"

          cat > "$SETTINGS_FILE" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "Godot Android settings:"
          cat "$SETTINGS_FILE"

          test -x "$JAVA_HOME/bin/java"
          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

      - name: Create Android Debug Keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storetype PKCS12

          echo "Debug keystore created."

      - name: Import Godot Project
        shell: bash
        run: |
          set -e
          godot --headless --editor --path . --quit

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail

          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/debug.keystore"

          godot --headless --verbose \
            --path . \
            --export-debug "Android" \
            CricketChampionship3D.apk 2>&1 | tee export.log

          test -s CricketChampionship3D.apk
          echo "APK export successful."

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Championship-3D-APK
          path: CricketChampionship3D.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Export Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Android-Export-Logs
          path: export.log
          if-no-files-found: ignore
          retention-days: 7
